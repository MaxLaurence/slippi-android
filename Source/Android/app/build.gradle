plugins {
    id 'com.android.application'
}

// No build-time secrets. The sign-in flow runs entirely inside a
// WebView pointed at slippi.gg/online/enable (see
// SlippiLoginActivity) so we don't carry any Firebase / Slippi
// credentials in the binary.
def forceTouchControls = project.findProperty('forceTouchControls')?.toString()?.toBoolean() ?: false
def skipMainlineCoreBuild = project.findProperty('skipMainlineCoreBuild')?.toString()?.toBoolean() ?: false
def mainlineSlippiRoot = file("${rootDir}/../../Externals/MainlineSlippiDolphin")
def mainlinePatchDir = file("${rootDir}/mainline-patches")
def mainlineWorkDir = layout.buildDirectory.dir("mainlineSlippi/source")
def mainlineCmakeBuildDir = layout.buildDirectory.dir("mainlineSlippi/cmake/arm64-v8a")
def mainlineGeneratedDir = layout.buildDirectory.dir("generated/mainlineSlippi")

android {
    namespace 'org.dolphinemu.dolphinemu'
    compileSdk 34
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'org.ishiiruka.slippidolphin'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '3.6.0-android'
        buildConfigField 'boolean', 'FORCE_TOUCH_CONTROLS', forceTouchControls ? 'true' : 'false'

        externalNativeBuild {
            cmake {
                // Point corrosion directly at the specific rustup-managed
                // toolchain pinned in Externals/SlippiRustExtensions/rust-toolchain.toml.
                // This avoids relying on corrosion's auto-detection of the
                // "active" toolchain via `rustup toolchain list`, which fails
                // when invoked from outside the override directory.
                def homeDir = System.getProperty('user.home')
                def rustToolchain = ''
                try {
                    def tomlText = new File("${rootDir}/../../Externals/SlippiRustExtensions/rust-toolchain.toml").text
                    def m = (tomlText =~ /channel\s*=\s*"([^"]+)"/)
                    if (m.find()) rustToolchain = m.group(1)
                } catch (Exception ignored) {}
                if (!rustToolchain) rustToolchain = '1.88.0'
                def rustupRoot = "${homeDir}/.rustup/toolchains/${rustToolchain}-aarch64-apple-darwin/bin"
                def rustcPath = new File(rustupRoot, 'rustc').exists() ? "${rustupRoot}/rustc" : ''
                def cargoPath = new File(rustupRoot, 'cargo').exists() ? "${rustupRoot}/cargo" : ''
                def rustupPath = new File("${homeDir}/.cargo/bin/rustup").exists()
                        ? "${homeDir}/.cargo/bin/rustup" : ''

                arguments(
                    '-DANDROID_STL=c++_shared',
                    '-DANDROID_PLATFORM=android-29',
                    '-DCMAKE_BUILD_TYPE=Release',
                    '-DENABLE_PCH=OFF',
                    // ENABLE_GENERIC=OFF lets the top-level CMakeLists pick up
                    // the aarch64 branch and turn on the JitArm64 sources —
                    // without it we'd get a JIT-less interpreter-only build,
                    // which is unplayable for Melee.
                    '-DENABLE_GENERIC=OFF',
                    '-DUSE_EGL=1',
                    '-DUSE_X11=0',
                    '-DUSE_UPNP=0',
                    '-DDISABLE_WX=1',
                    '-DENABLE_QT2=0',
                    '-DENABLE_HEADLESS=OFF',
                    '-DENABLE_TESTS=OFF',
                    '-DENABLE_VULKAN=ON'
                )
                if (rustcPath) arguments "-DRust_COMPILER=${rustcPath}"
                if (cargoPath) arguments "-DRust_CARGO=${cargoPath}"
                if (rustupPath) arguments "-DRust_RUSTUP=${rustupPath}"
                arguments '-DRust_RESOLVE_RUSTUP_TOOLCHAINS=OFF'

                abiFilters 'arm64-v8a'
                cppFlags '-std=c++17 -fexceptions -frtti'
                targets 'main'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
        prefab = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            // Mirror the Sys/ tree we populate from CMake — without an
            // explicit assets dir, AGP doesn't pick up the bundled
            // codehandler.bin / GameFiles / Slippi/InjectionLists / etc.
            assets.srcDirs = ['src/main/assets', "$buildDir/generated/mainlineSlippi/assets"]
            jniLibs.srcDirs = ['src/main/jniLibs', "$buildDir/generated/mainlineSlippi/jniLibs"]
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    signingConfigs {
        // Resolve a release keystore from env vars when present; otherwise
        // fall back to the developer's `~/.android/debug.keystore` so a
        // plain `:app:assembleRelease` produces an installable APK without
        // any extra setup. For reproducible / multi-device installs you
        // want a stable release key — see Source/Android/README.md.
        release {
            def releaseStore = System.getenv('RELEASE_KEYSTORE_PATH')
            def homeDir = System.getProperty('user.home')
            if (releaseStore && new File(releaseStore).exists()) {
                storeFile file(releaseStore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            } else {
                def debugKeystore = file("${homeDir}/.android/debug.keystore")
                if (debugKeystore.exists()) {
                    storeFile debugKeystore
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
    }

    buildTypes {
        debug {
            // Keep debug installs separate from both release builds and
            // upstream Dolphin. The Java namespace stays org.dolphinemu.*
            // because JNI symbols and FindClass paths depend on it.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            jniDebuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.oboe:oboe:1.10.0'
    // For EncryptedSharedPreferences (refresh-token storage). 1.1.0-alpha06
    // is the latest published as of 2026-01; the stable 1.0.0 line still
    // works but uses the deprecated KeyGenParameterSpec helper.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}

def mainlineSubmodulePaths = [
        'Externals/SlippiRustExtensions',
        'Externals/corrosion',
        'Externals/enet/enet',
        'Externals/cubeb/cubeb',
        'Externals/fmt/fmt',
        'Externals/curl/curl',
        'Externals/libusb/libusb',
        'Externals/zlib-ng/zlib-ng',
        'Externals/lz4/lz4',
        'Externals/xxhash/xxHash',
        'Externals/spirv_cross/SPIRV-Cross',
        'Externals/Vulkan-Headers',
        'Externals/VulkanMemoryAllocator',
        'Externals/libspng/libspng',
        'Externals/minizip-ng/minizip-ng',
        'Externals/hidapi/hidapi-src',
        'Externals/zstd/zstd',
        'Externals/rcheevos/rcheevos',
        'Externals/implot/implot',
        'Externals/libadrenotools',
        'Externals/SDL/SDL',
        'Externals/SFML/SFML',
        'Externals/mGBA/mgba',
        'Externals/tinygltf/tinygltf'
]

tasks.register('initMainlineSlippiSubmodules', Exec) {
    onlyIf { !skipMainlineCoreBuild && new File(mainlineSlippiRoot, 'CMakeLists.txt').isFile() }
    workingDir mainlineSlippiRoot
    commandLine(['git', 'submodule', 'update', '--init', '--recursive', '--depth', '1'] + mainlineSubmodulePaths)
}

tasks.register('verifyMainlineSlippiSource') {
    dependsOn tasks.named('initMainlineSlippiSubmodules')
    onlyIf { !skipMainlineCoreBuild }
    doLast {
        def required = [
                new File(mainlineSlippiRoot, 'CMakeLists.txt'),
                new File(mainlineSlippiRoot, 'Source/Android/jni/CMakeLists.txt'),
                new File(mainlineSlippiRoot, 'Source/Core/Core/Slippi'),
                new File(mainlineSlippiRoot, 'Data/Sys'),
                new File(mainlineSlippiRoot, 'Externals/SlippiRustExtensions/Cargo.toml'),
                new File(mainlineSlippiRoot, 'Externals/corrosion/CMakeLists.txt')
        ]
        def missing = required.findAll { !it.exists() }
        if (!missing.empty) {
            throw new GradleException(
                    'Embedded mainline Slippi Dolphin source is incomplete. Run ' +
                    '`git submodule update --init --recursive Externals/MainlineSlippiDolphin` ' +
                    'from the repository root. Missing: ' +
                    missing.collect { it.path }.join(', '))
        }
    }
}

tasks.register('prepareMainlineSlippiSource', Sync) {
    dependsOn tasks.named('verifyMainlineSlippiSource')
    onlyIf { !skipMainlineCoreBuild }
    from(mainlineSlippiRoot) {
        exclude '**/.git', '**/.git/**'
        exclude 'Source/Android/app/build/**'
        exclude 'Source/Android/.gradle/**'
        exclude 'Build/**'
        exclude 'Binary/**'
        exclude 'Externals/SFML/SFML/test/**'
        exclude 'Externals/SFML/SFML/examples/**'
    }
    into(mainlineWorkDir)
}

tasks.register('applyMainlineSlippiPatches') {
    dependsOn tasks.named('prepareMainlineSlippiSource')
    onlyIf { !skipMainlineCoreBuild }
    inputs.dir(mainlinePatchDir).optional()
    outputs.dir(mainlineWorkDir)
    outputs.upToDateWhen { false }
    doLast {
        if (!mainlinePatchDir.isDirectory()) {
            logger.lifecycle("No mainline Slippi patch directory found at ${mainlinePatchDir}")
            return
        }

        def patches = fileTree(mainlinePatchDir) {
            include '*.patch'
            include '*.diff'
        }.files.toList().sort { it.name }

        if (patches.empty) {
            logger.lifecycle("No mainline Slippi patches to apply")
            return
        }

        def sourceDir = mainlineWorkDir.get().asFile
        patches.each { patch ->
            def reverseCheck = exec {
                workingDir sourceDir
                commandLine 'git', 'apply', '--reverse', '--check', patch.absolutePath
                ignoreExitValue true
            }
            if (reverseCheck.exitValue == 0) {
                logger.lifecycle("Mainline Slippi patch ${patch.name} is already applied")
                return
            }

            def applyCheck = exec {
                workingDir sourceDir
                commandLine 'git', 'apply', '--check', patch.absolutePath
                ignoreExitValue true
            }
            if (applyCheck.exitValue == 0) {
                exec {
                    workingDir sourceDir
                    commandLine 'git', 'apply', patch.absolutePath
                }
                logger.lifecycle("Applied mainline Slippi patch ${patch.name}")
                return
            }

            throw new GradleException(
                    "Could not apply mainline Slippi patch ${patch.name}. " +
                    "Upstream probably changed one of the patched files; refresh " +
                    "Source/Android/mainline-patches before rebuilding.")
        }
    }
}

def rustToolchainArgsFor = { File sourceDir ->
    def args = []
    def homeDir = System.getProperty('user.home')
    def rustToolchain = ''
    try {
        def tomlText = new File(sourceDir, 'Externals/SlippiRustExtensions/rust-toolchain.toml').text
        def m = (tomlText =~ /channel\s*=\s*"([^"]+)"/)
        if (m.find()) rustToolchain = m.group(1)
    } catch (Exception ignored) {}
    if (!rustToolchain) rustToolchain = '1.88.0'
    def hostTriple = System.getProperty('os.arch') == 'aarch64'
            ? 'aarch64-apple-darwin' : 'x86_64-apple-darwin'
    def rustupRoot = "${homeDir}/.rustup/toolchains/${rustToolchain}-${hostTriple}/bin"
    def rustcPath = new File(rustupRoot, 'rustc')
    def cargoPath = new File(rustupRoot, 'cargo')
    def rustupPath = new File("${homeDir}/.cargo/bin/rustup")
    if (rustcPath.exists()) args << "-DRust_COMPILER=${rustcPath.absolutePath}"
    if (cargoPath.exists()) args << "-DRust_CARGO=${cargoPath.absolutePath}"
    if (rustupPath.exists()) args << "-DRust_RUSTUP=${rustupPath.absolutePath}"
    args << '-DRust_RESOLVE_RUSTUP_TOOLCHAINS=OFF'
    return args
}

tasks.register('configureMainlineSlippiCore', Exec) {
    dependsOn tasks.named('applyMainlineSlippiPatches')
    onlyIf { !skipMainlineCoreBuild }
    doFirst {
        def sourceDir = mainlineWorkDir.get().asFile
        def nativeBuildDir = mainlineCmakeBuildDir.get().asFile
        nativeBuildDir.mkdirs()
        def cmakeBinDir = new File(android.sdkDirectory, 'cmake/3.22.1/bin')
        def cmake = new File(cmakeBinDir, 'cmake')
        def ninja = new File(cmakeBinDir, 'ninja')
        def ndkDir = android.ndkDirectory
        if (!cmake.isFile() || !ninja.isFile()) {
            throw new GradleException("Android CMake 3.22.1 is required at ${cmakeBinDir}")
        }
        if (ndkDir == null || !ndkDir.isDirectory()) {
            throw new GradleException("Android NDK is required to build embedded mainline Slippi")
        }
        def cmakeArgs = [
                cmake.absolutePath,
                '-S', sourceDir.absolutePath,
                '-B', nativeBuildDir.absolutePath,
                '-G', 'Ninja',
                "-DCMAKE_MAKE_PROGRAM=${ninja.absolutePath}",
                "-DCMAKE_TOOLCHAIN_FILE=${new File(ndkDir, 'build/cmake/android.toolchain.cmake').absolutePath}",
                '-DANDROID_ABI=arm64-v8a',
                '-DANDROID_PLATFORM=android-29',
                '-DANDROID_STL=c++_static',
                '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                '-DCMAKE_CXX_FLAGS=-DDOLPHIN_DATA_DIR=\\"SlippiOnline\\"',
                '-DCMAKE_BUILD_TYPE=RelWithDebInfo',
                '-DENABLE_GENERIC=OFF',
                '-DENABLE_HEADLESS=OFF',
                '-DENABLE_NOGUI=OFF',
                '-DENABLE_PCH=OFF',
                '-DENABLE_QT=OFF',
                '-DENABLE_TESTS=OFF',
                '-DENABLE_VULKAN=ON',
                '-DUSE_RETRO_ACHIEVEMENTS=ON',
                '-DUSE_UPNP=OFF'
        ] + rustToolchainArgsFor(sourceDir)
        commandLine cmakeArgs
        environment 'PATH', "${cmakeBinDir.absolutePath}:${System.getenv('PATH') ?: ''}"
    }
}

tasks.register('buildMainlineSlippiCore', Exec) {
    dependsOn tasks.named('configureMainlineSlippiCore')
    onlyIf { !skipMainlineCoreBuild }
    doFirst {
        def cmake = new File(android.sdkDirectory, 'cmake/3.22.1/bin/cmake')
        commandLine cmake.absolutePath, '--build', mainlineCmakeBuildDir.get().asFile.absolutePath,
                '--target', 'main', '--parallel',
                Integer.toString(Runtime.getRuntime().availableProcessors())
    }
}

tasks.register('syncMainlineSlippiCore') {
    dependsOn tasks.named('buildMainlineSlippiCore')
    onlyIf { !skipMainlineCoreBuild }
    doLast {
        def generatedDir = mainlineGeneratedDir.get().asFile
        def jniDir = new File(generatedDir, 'jniLibs/arm64-v8a')
        def assetDir = new File(generatedDir, 'assets/MainlineSys')
        delete jniDir
        delete assetDir
        jniDir.mkdirs()
        def libs = fileTree(mainlineCmakeBuildDir.get().asFile) {
            include '**/libmain.so'
        }.files as List
        if (libs.empty) {
            throw new GradleException('Mainline Slippi native build did not produce libmain.so')
        }
        copy {
            from libs.first()
            into jniDir
            rename { 'libmainline_slippi.so' }
        }
        copy {
            from new File(mainlineWorkDir.get().asFile, 'Data/Sys')
            into assetDir
        }
    }
}

if (!skipMainlineCoreBuild) {
    tasks.named('preBuild') {
        dependsOn tasks.named('syncMainlineSlippiCore')
    }
}
