plugins {
    id 'com.android.application'
}

// No build-time secrets. The sign-in flow runs entirely inside a
// WebView pointed at slippi.gg/online/enable (see
// SlippiLoginActivity) so we don't carry any Firebase / Slippi
// credentials in the binary.
def forceTouchControls = project.findProperty('forceTouchControls')?.toString()?.toBoolean() ?: false

android {
    namespace 'org.dolphinemu.dolphinemu'
    compileSdk 34
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'org.dolphinemu.dolphinemu'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '3.6.0-android'
        buildConfigField 'boolean', 'FORCE_TOUCH_CONTROLS', forceTouchControls ? 'true' : 'false'

        externalNativeBuild {
            cmake {
                // Point corrosion directly at the specific rustup-managed
                // toolchain pinned in Externals/SlippiRustExtensions/rust-toolchain.toml.
                // This avoids relying on corrosion's auto-detection of the
                // "active" toolchain via `rustup toolchain list`, which fails
                // when invoked from outside the override directory.
                def homeDir = System.getProperty('user.home')
                def rustToolchain = ''
                try {
                    def tomlText = new File("${rootDir}/../../Externals/SlippiRustExtensions/rust-toolchain.toml").text
                    def m = (tomlText =~ /channel\s*=\s*"([^"]+)"/)
                    if (m.find()) rustToolchain = m.group(1)
                } catch (Exception ignored) {}
                if (!rustToolchain) rustToolchain = '1.88.0'
                def rustupRoot = "${homeDir}/.rustup/toolchains/${rustToolchain}-aarch64-apple-darwin/bin"
                def rustcPath = new File(rustupRoot, 'rustc').exists() ? "${rustupRoot}/rustc" : ''
                def cargoPath = new File(rustupRoot, 'cargo').exists() ? "${rustupRoot}/cargo" : ''
                def rustupPath = new File("${homeDir}/.cargo/bin/rustup").exists()
                        ? "${homeDir}/.cargo/bin/rustup" : ''

                arguments(
                    '-DANDROID_STL=c++_shared',
                    '-DANDROID_PLATFORM=android-29',
                    '-DCMAKE_BUILD_TYPE=Release',
                    '-DENABLE_PCH=OFF',
                    // ENABLE_GENERIC=OFF lets the top-level CMakeLists pick up
                    // the aarch64 branch and turn on the JitArm64 sources —
                    // without it we'd get a JIT-less interpreter-only build,
                    // which is unplayable for Melee.
                    '-DENABLE_GENERIC=OFF',
                    '-DUSE_EGL=1',
                    '-DUSE_X11=0',
                    '-DUSE_UPNP=0',
                    '-DDISABLE_WX=1',
                    '-DENABLE_QT2=0',
                    '-DENABLE_HEADLESS=OFF',
                    '-DENABLE_TESTS=OFF',
                    '-DENABLE_VULKAN=ON'
                )
                if (rustcPath) arguments "-DRust_COMPILER=${rustcPath}"
                if (cargoPath) arguments "-DRust_CARGO=${cargoPath}"
                if (rustupPath) arguments "-DRust_RUSTUP=${rustupPath}"
                arguments '-DRust_RESOLVE_RUSTUP_TOOLCHAINS=OFF'

                abiFilters 'arm64-v8a'
                cppFlags '-std=c++17 -fexceptions -frtti'
                targets 'main'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            // Mirror the Sys/ tree we populate from CMake — without an
            // explicit assets dir, AGP doesn't pick up the bundled
            // codehandler.bin / GameFiles / Slippi/InjectionLists / etc.
            assets.srcDirs = ['src/main/assets']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    signingConfigs {
        // Resolve a release keystore from env vars when present; otherwise
        // fall back to the developer's `~/.android/debug.keystore` so a
        // plain `:app:assembleRelease` produces an installable APK without
        // any extra setup. For reproducible / multi-device installs you
        // want a stable release key — see Source/Android/README.md.
        release {
            def releaseStore = System.getenv('RELEASE_KEYSTORE_PATH')
            def homeDir = System.getProperty('user.home')
            if (releaseStore && new File(releaseStore).exists()) {
                storeFile file(releaseStore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            } else {
                def debugKeystore = file("${homeDir}/.android/debug.keystore")
                if (debugKeystore.exists()) {
                    storeFile debugKeystore
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
    }

    buildTypes {
        debug {
            // Intentionally no applicationIdSuffix: the device is a
            // single-purpose handheld and we want each debug install
            // to update the existing "Slippi Dolphin" rather than
            // installing alongside it.
            versionNameSuffix '-debug'
            jniDebuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // For EncryptedSharedPreferences (refresh-token storage). 1.1.0-alpha06
    // is the latest published as of 2026-01; the stable 1.0.0 line still
    // works but uses the deprecated KeyGenParameterSpec helper.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
