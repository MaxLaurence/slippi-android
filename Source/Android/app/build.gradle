plugins {
    id 'com.android.application'
}

// No build-time secrets. The sign-in flow runs entirely inside a
// WebView pointed at slippi.gg/online/enable (see
// SlippiLoginActivity) so we don't carry any Firebase / Slippi
// credentials in the binary.
def repoRoot = file("${rootDir}/../..")
def forceTouchControls = project.findProperty('forceTouchControls')?.toString()?.toBoolean() ?: false
def skipMainlineCoreBuild = project.findProperty('skipMainlineCoreBuild')?.toString()?.toBoolean() ?: false
def allowDirtyMainlineSource = project.findProperty('allowDirtyMainlineSource')?.toString()?.toBoolean() ?: false
def supportedAndroidAbis = ['arm64-v8a', 'x86_64']
def androidAbi = project.findProperty('androidAbi')?.toString()?.trim() ?: 'arm64-v8a'
if (!supportedAndroidAbis.contains(androidAbi)) {
    throw new GradleException(
            "Unsupported androidAbi='${androidAbi}'. Supported values: ${supportedAndroidAbis.join(', ')}")
}
def androidVersionPattern = ~/^v?([0-9]+)\.([0-9]+)\.([0-9]+)-android-r([0-9]+)(-[A-Za-z0-9][A-Za-z0-9._-]*)?$/
def runGit = { List<String> args ->
    def standardOutputBytes = new ByteArrayOutputStream()
    def errorOutputBytes = new ByteArrayOutputStream()
    def result = exec {
        workingDir repoRoot
        commandLine args
        ignoreExitValue true
        standardOutput = standardOutputBytes
        errorOutput = errorOutputBytes
    }
    return result.exitValue == 0 ? standardOutputBytes.toString('UTF-8').trim() : ''
}
def runGitInDir = { File workingDir, List<String> args ->
    def standardOutputBytes = new ByteArrayOutputStream()
    def errorOutputBytes = new ByteArrayOutputStream()
    def result = exec {
        setWorkingDir(workingDir)
        commandLine(['git'] + args)
        ignoreExitValue true
        standardOutput = standardOutputBytes
        errorOutput = errorOutputBytes
    }
    return [
            exitValue: result.exitValue,
            stdout: standardOutputBytes.toString('UTF-8').trim(),
            stderr: errorOutputBytes.toString('UTF-8').trim()
    ]
}
def latestAndroidReleaseTag = {
    runGit(['git', 'describe', '--tags', '--match', 'v*-android-r*', '--abbrev=0'])
}
def normalizeAndroidVersionName = { Object rawValue ->
    def value = rawValue.toString().trim()
    def matcher = value =~ androidVersionPattern
    if (!matcher.matches()) {
        throw new GradleException(
                "Android version must look like 3.6.0-android-r7 or 3.6.0-android-r7-experimental, got '${value}'")
    }
    return value.startsWith('v') ? value.substring(1) : value
}
def versionCodeForAndroidVersion = { String versionName ->
    def matcher = versionName =~ androidVersionPattern
    if (!matcher.matches()) {
        throw new GradleException(
                "Android version must look like 3.6.0-android-r7 or 3.6.0-android-r7-experimental, got '${versionName}'")
    }
    return matcher.group(1).toInteger() * 1000000 +
            matcher.group(2).toInteger() * 10000 +
            matcher.group(3).toInteger() * 100 +
            matcher.group(4).toInteger()
}
def explicitAndroidVersionName = project.findProperty('androidVersionName')
def explicitAndroidVersionCode = project.findProperty('androidVersionCode')
def inferredAndroidVersionTag = latestAndroidReleaseTag()
def androidVersionName = normalizeAndroidVersionName(
        explicitAndroidVersionName ?: (inferredAndroidVersionTag ?: '3.6.0-android-r0'))
def expectedAndroidVersionCode = versionCodeForAndroidVersion(androidVersionName)
def androidVersionCode = explicitAndroidVersionCode != null
        ? explicitAndroidVersionCode.toString().toInteger()
        : expectedAndroidVersionCode
if (androidVersionCode != expectedAndroidVersionCode &&
        !project.findProperty('allowAndroidVersionCodeOverride')?.toString()?.toBoolean()) {
    throw new GradleException(
            "androidVersionCode=${androidVersionCode} does not match " +
            "${androidVersionName} (expected ${expectedAndroidVersionCode}). " +
            "Pass -PallowAndroidVersionCodeOverride=true only for a deliberate compatibility build.")
}
def apkOutputNameFor = { String variantName ->
    if (androidAbi == 'arm64-v8a') {
        return "app-${variantName}.apk"
    }
    "slippi-android-${androidVersionName}-${androidAbi}-${variantName}.apk".toString()
}
def slippiRustPatchDir = file("${rootDir}/slippi-rust-patches")
def mainlineSlippiRoot = new File(repoRoot, 'Externals/MainlineSlippiDolphin')
def mainlinePatchDir = file("${rootDir}/mainline-patches")
def mainlineWorkDir = layout.buildDirectory.dir("mainlineSlippi/source")
def mainlineCmakeBuildDir = layout.buildDirectory.dir("mainlineSlippi/cmake/${androidAbi}")
def mainlineGeneratedDir = layout.buildDirectory.dir("generated/mainlineSlippi")
def mainlineOboePrefabDir = layout.buildDirectory.dir("mainlineSlippi/oboePrefab")

def rustToolchainArgsFor = { File sourceDir ->
    def args = []
    def homeDir = System.getProperty('user.home')
    def rustToolchain = ''
    try {
        def tomlText = new File(sourceDir, 'Externals/SlippiRustExtensions/rust-toolchain.toml').text
        def m = (tomlText =~ /channel\s*=\s*"([^"]+)"/)
        if (m.find()) rustToolchain = m.group(1)
    } catch (Exception ignored) {}
    if (!rustToolchain) rustToolchain = '1.88.0'

    def osName = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch')
    def hostTriple
    if (osName.contains('mac')) {
        hostTriple = arch == 'aarch64' ? 'aarch64-apple-darwin' : 'x86_64-apple-darwin'
    } else if (osName.contains('linux')) {
        hostTriple = (arch == 'aarch64' || arch == 'arm64')
                ? 'aarch64-unknown-linux-gnu' : 'x86_64-unknown-linux-gnu'
    } else {
        throw new GradleException("Unsupported Rust build host OS: ${System.getProperty('os.name')}")
    }

    def rustupRoot = "${homeDir}/.rustup/toolchains/${rustToolchain}-${hostTriple}/bin"
    def rustcPath = new File(rustupRoot, 'rustc')
    def cargoPath = new File(rustupRoot, 'cargo')
    def rustupPath = new File("${homeDir}/.cargo/bin/rustup")
    if (rustcPath.exists()) args << "-DRust_COMPILER=${rustcPath.absolutePath}"
    if (cargoPath.exists()) args << "-DRust_CARGO=${cargoPath.absolutePath}"
    if (rustupPath.exists()) args << "-DRust_RUSTUP=${rustupPath.absolutePath}"
    args << '-DRust_RESOLVE_RUSTUP_TOOLCHAINS=OFF'
    return args
}

android {
    namespace 'org.dolphinemu.dolphinemu'
    compileSdk 35
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'org.ishiiruka.slippidolphin'
        minSdk 29
        targetSdk 35
        versionCode androidVersionCode
        versionName androidVersionName
        buildConfigField 'boolean', 'FORCE_TOUCH_CONTROLS', forceTouchControls ? 'true' : 'false'
        buildConfigField 'String', 'ANDROID_ABI', "\"${androidAbi}\""

        externalNativeBuild {
            cmake {
                arguments(
                    '-DANDROID_STL=c++_shared',
                    '-DANDROID_PLATFORM=android-29',
                    '-DCMAKE_BUILD_TYPE=Release',
                    '-DENABLE_PCH=OFF',
                    // ENABLE_GENERIC=OFF lets the top-level CMakeLists select
                    // the native JIT for the requested ABI. Without it, Android
                    // can fall back to a JIT-less interpreter build, which is
                    // unplayable for Melee.
                    '-DENABLE_GENERIC=OFF',
                    '-DUSE_EGL=1',
                    '-DUSE_X11=0',
                    '-DUSE_UPNP=0',
                    '-DDISABLE_WX=1',
                    '-DENABLE_QT2=0',
                    '-DENABLE_HEADLESS=OFF',
                    '-DENABLE_TESTS=OFF',
                    '-DENABLE_VULKAN=ON'
                )
                arguments(*rustToolchainArgsFor(repoRoot))

                abiFilters androidAbi
                cppFlags '-std=c++17 -fexceptions -frtti'
                targets 'main'
            }
        }

        ndk {
            abiFilters androidAbi
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
        prefab = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            // Mirror the Sys/ tree we populate from CMake — without an
            // explicit assets dir, AGP doesn't pick up the bundled
            // codehandler.bin / GameFiles / Slippi/InjectionLists / etc.
            assets.srcDirs = ['src/main/assets', "$buildDir/generated/mainlineSlippi/assets"]
            jniLibs.srcDirs = ['src/main/jniLibs', "$buildDir/generated/mainlineSlippi/jniLibs"]
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    signingConfigs {
        // Resolve a release keystore from env vars when present; otherwise
        // fall back to the developer's `~/.android/debug.keystore` so a
        // plain `:app:assembleRelease` produces an installable APK without
        // any extra setup. For reproducible / multi-device installs you
        // want a stable release key — see Source/Android/README.md.
        release {
            def releaseStore = System.getenv('RELEASE_KEYSTORE_PATH')
            def homeDir = System.getProperty('user.home')
            if (releaseStore && new File(releaseStore).exists()) {
                storeFile file(releaseStore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            } else {
                def debugKeystore = file("${homeDir}/.android/debug.keystore")
                if (debugKeystore.exists()) {
                    storeFile debugKeystore
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
    }

    buildTypes {
        debug {
            // Keep debug installs separate from both release builds and
            // upstream Dolphin. The Java namespace stays org.dolphinemu.*
            // because JNI symbols and FindClass paths depend on it.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            jniDebuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(apkOutputNameFor(variant.name))
        }
    }
}

