def applyPatchQueue = { File sourceDir, File patchDir, String label ->
    if (!patchDir.isDirectory()) {
        logger.lifecycle("No ${label} patch directory found at ${patchDir}")
        return
    }

    def patches = fileTree(patchDir) {
        include '*.patch'
        include '*.diff'
    }.files.toList().sort { it.name }

    if (patches.empty) {
        logger.lifecycle("No ${label} patches to apply")
        return
    }

    def gitCeilingDir = sourceDir.parentFile.absolutePath
    def runPatchCommand = { List<String> gitArgs ->
        def standardOutputBytes = new ByteArrayOutputStream()
        def errorOutputBytes = new ByteArrayOutputStream()
        def result = exec {
            workingDir sourceDir
            environment 'GIT_CEILING_DIRECTORIES', gitCeilingDir
            commandLine gitArgs
            ignoreExitValue true
            standardOutput = standardOutputBytes
            errorOutput = errorOutputBytes
        }

        return [
                exitValue: result.exitValue,
                stdout: standardOutputBytes.toString('UTF-8').trim(),
                stderr: errorOutputBytes.toString('UTF-8').trim()
        ]
    }
    def checkPatch = { List<String> gitApplyArgs ->
        runPatchCommand(gitApplyArgs)
    }
    def isFormatPatch = { File patch ->
        def header = patch.withReader('UTF-8') { reader ->
            def lines = []
            for (int i = 0; i < 40; i++) {
                def line = reader.readLine()
                if (line == null) break
                lines << line
            }
            lines.join('\n')
        }
        return header.readLines().any { it.startsWith('Subject: ') }
    }
    def ensurePatchGitRepo = {
        if (new File(sourceDir, '.git').exists()) {
            return
        }

        def init = runPatchCommand(['git', 'init'])
        if (init.exitValue != 0) {
            throw new GradleException(
                    "Could not initialize temporary git repo for ${label} patches." +
                            ([init.stderr, init.stdout].findAll { it }.join(System.lineSeparator())
                                    ? "${System.lineSeparator()}${[init.stderr, init.stdout].findAll { it }.join(System.lineSeparator())}"
                                    : ""))
        }
        runPatchCommand(['git', 'config', 'user.name', 'Ishiiruka Android Patch Queue'])
        runPatchCommand(['git', 'config', 'user.email', 'android-patches@localhost'])
        def add = runPatchCommand(['git', 'add', '-A'])
        if (add.exitValue != 0) {
            throw new GradleException("Could not stage ${label} base tree for three-way patching.")
        }
        def commit = runPatchCommand(['git', 'commit', '--allow-empty', '-m', "${label} base"])
        if (commit.exitValue != 0) {
            def diagnostics = ([commit.stderr, commit.stdout].findAll { it }
                    .join(System.lineSeparator()))
            throw new GradleException(
                    "Could not create ${label} base commit for three-way patching." +
                            (diagnostics ? "${System.lineSeparator()}${diagnostics}" : ""))
        }
    }

    patches.each { patch ->
        def reverseCheck = checkPatch(['git', 'apply', '--reverse', '--check', patch.absolutePath])
        if (reverseCheck.exitValue == 0) {
            logger.lifecycle("${label} patch ${patch.name} is already applied")
            return
        }

        if (isFormatPatch(patch)) {
            ensurePatchGitRepo()
            def amResult = runPatchCommand(['git', 'am', '--3way', '--keep-cr', patch.absolutePath])
            if (amResult.exitValue == 0) {
                logger.lifecycle("Applied ${label} format patch ${patch.name}")
                return
            }

            // The prepared source tree is initialized as a fresh temporary git repo,
            // so format patches with full-index metadata can reference blob objects
            // that are not present even when the patch applies cleanly. Fall back to
            // a direct `git am` before reporting the patch as stale.
            runPatchCommand(['git', 'am', '--abort'])
            def amDirectResult = runPatchCommand(['git', 'am', '--keep-cr', patch.absolutePath])
            if (amDirectResult.exitValue == 0) {
                logger.lifecycle("Applied ${label} format patch ${patch.name}")
                return
            }

            def statusResult = runPatchCommand(['git', 'status', '--short'])
            def diagnostics = ([amResult.stderr, amResult.stdout, amDirectResult.stderr,
                                amDirectResult.stdout, statusResult.stdout, statusResult.stderr]
                    .findAll { it }
                    .join(System.lineSeparator()))
            throw new GradleException(
                    "Could not apply ${label} format patch ${patch.name} with git am --3way. " +
                    "Upstream probably changed one of the patched files; rebuild the patch " +
                    "branch with scripts/mainline-patch.sh apply, resolve the conflict, then " +
                    "run scripts/mainline-patch.sh export." +
                    (diagnostics ? "${System.lineSeparator()}${diagnostics}" : ""))
        }

        def applyCheck = checkPatch(['git', 'apply', '--check', patch.absolutePath])
        if (applyCheck.exitValue == 0) {
            exec {
                workingDir sourceDir
                environment 'GIT_CEILING_DIRECTORIES', gitCeilingDir
                commandLine 'git', 'apply', patch.absolutePath
            }
            logger.lifecycle("Applied ${label} patch ${patch.name}")
            return
        }

        def diagnostics = ([reverseCheck.stderr, reverseCheck.stdout,
                            applyCheck.stderr, applyCheck.stdout]
                .findAll { it }
                .join(System.lineSeparator()))
        throw new GradleException(
                "Could not apply ${label} patch ${patch.name}. " +
                "Upstream probably changed one of the patched files; refresh " +
                "${patchDir.path} before rebuilding." +
                (diagnostics ? "${System.lineSeparator()}${diagnostics}" : ""))
    }
}

tasks.register('applySlippiRustPatches') {
    inputs.dir(slippiRustPatchDir).optional()
    outputs.upToDateWhen { false }
    doLast {
        def sourceDir = file("${rootDir}/../../Externals/SlippiRustExtensions")
        if (!new File(sourceDir, 'Cargo.toml').isFile()) {
            throw new GradleException(
                    'SlippiRustExtensions source is incomplete. Run ' +
                    '`git submodule update --init --recursive Externals/SlippiRustExtensions` ' +
                    'from the repository root.')
        }
        applyPatchQueue(sourceDir, slippiRustPatchDir, 'Slippi Rust')
    }
}

tasks.register('printAndroidVersion') {
    doLast {
        println "androidVersionName=${androidVersionName}"
        println "androidVersionCode=${androidVersionCode}"
        println "androidAbi=${androidAbi}"
    }
}

tasks.register('validateAndroidReleaseVersion') {
    doLast {
        if (explicitAndroidVersionName != null) {
            return
        }
        def matchingHeadTag = runGit([
                'git', 'tag', '--points-at', 'HEAD', '--list', "v${androidVersionName}"])
        if (!matchingHeadTag) {
            throw new GradleException(
                    "Refusing to assemble an unversioned release APK from an untagged commit. " +
                    "HEAD is not tagged v${androidVersionName}; pass -PandroidVersionName=<x.y.z-android-rN> " +
                    "or build from the release tag.")
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    dependsOn tasks.named('validateAndroidReleaseVersion')
}

def variantOutputDir = { String variantName ->
    file("${buildDir}/outputs/apk/${variantName}")
}

def apkOutputForVariant = { String variantName ->
    def outputDir = variantOutputDir(variantName)
    def metadataFile = new File(outputDir, 'output-metadata.json')
    if (metadataFile.isFile()) {
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        def outputFile = metadata.elements?.find { it.outputFile }?.outputFile
        if (outputFile) {
            return new File(outputDir, outputFile.toString())
        }
    }

    return new File(outputDir, apkOutputNameFor(variantName))
}

def verifyPackagedApk = { String variantName ->
    def apk = apkOutputForVariant(variantName)
    if (!apk.isFile()) {
        throw new GradleException("Expected ${variantName} APK was not produced: ${apk}")
    }

    def entriesOutput = new ByteArrayOutputStream()
    exec {
        commandLine 'unzip', '-Z1', apk.absolutePath
        standardOutput = entriesOutput
    }
    def entries = entriesOutput.toString('UTF-8').readLines()
    def expectedLibPrefix = "lib/${androidAbi}/".toString()
    def nativeEntries = entries.findAll { it.startsWith('lib/') }
    def wrongAbiEntries = nativeEntries.findAll { !it.startsWith(expectedLibPrefix) }
    if (!wrongAbiEntries.empty) {
        throw new GradleException(
                "APK ${apk.name} contains native libraries outside ${expectedLibPrefix}: " +
                        wrongAbiEntries.take(8).join(', '))
    }

    def requiredEntries = [
            expectedLibPrefix + 'libmain.so',
            expectedLibPrefix + 'libmainline_slippi.so',
            expectedLibPrefix + 'libslippi_rust_extensions.so',
            'assets/MainlineSys/bootloader.gct',
            'assets/MainlinePlaybackGeckoCodes/GALE01r2.ini'
    ]
    def missingEntries = requiredEntries.findAll { !entries.contains(it) }
    if (!missingEntries.empty) {
        throw new GradleException(
                "APK ${apk.name} is missing required packaged files: " +
                        missingEntries.join(', '))
    }

    logger.lifecycle("Verified ${apk.name} packages ${androidAbi} Ishiiruka and mainline Slippi cores")
}

['debug', 'release'].each { variantName ->
    def capitalized = variantName.capitalize()
    def verifyTask = tasks.register("verify${capitalized}ApkContents") {
        onlyIf { !skipMainlineCoreBuild }
        doLast {
            verifyPackagedApk(variantName)
        }
    }
    tasks.matching { it.name == "assemble${capitalized}" }.configureEach {
        finalizedBy verifyTask
    }
}

