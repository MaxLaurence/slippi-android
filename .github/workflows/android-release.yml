name: Android Release

on:
  push:
    tags:
      - 'v*-android-r*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, for example 3.6.0-android-r7'
        required: true
        type: string

jobs:
  build:
    name: Build Android release APK
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android-release.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check out embedded mainline Slippi Dolphin
        run: |
          if [ ! -e Externals/MainlineSlippiDolphin/CMakeLists.txt ]; then
            rm -rf Externals/MainlineSlippiDolphin
            git clone --depth=1 --branch slippi \
              https://github.com/project-slippi/dolphin.git \
              Externals/MainlineSlippiDolphin
          fi

      - name: Install Android packages
        run: sdkmanager 'ndk;27.1.12297006' 'build-tools;35.0.0' 'platforms;android-35' 'cmake;3.22.1'

      - name: Set up Rust
        run: |
          rust_version="$(sed -n 's/^channel = "\(.*\)"/\1/p' Externals/SlippiRustExtensions/rust-toolchain.toml)"
          rustup toolchain install "$rust_version"
          rustup target add --toolchain "$rust_version" aarch64-linux-android
          rustup target add --toolchain "$rust_version" x86_64-linux-android

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi

          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-android-r([0-9]+)$ ]]; then
            echo "Version must look like 3.6.0-android-r7" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          android_release="${BASH_REMATCH[4]}"
          code=$((major * 1000000 + minor * 10000 + patch * 100 + android_release))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is required for release builds" >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os

          data = os.environ["ANDROID_RELEASE_KEYSTORE_BASE64"]
          path = os.environ["RELEASE_KEYSTORE_PATH"]
          with open(path, "wb") as f:
              f.write(base64.b64decode(data))
          PY
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}

      - name: Build and package release APKs
        run: |
          set -euo pipefail
          mkdir -p android-release

          build_apk() {
            local abi="$1"
            ./Source/Android/gradlew -p Source/Android :app:assembleRelease \
              -PandroidAbi="$abi" \
              -PandroidVersionName='${{ steps.version.outputs.name }}' \
              -PandroidVersionCode='${{ steps.version.outputs.code }}'
          }

          build_apk arm64-v8a
          cp Source/Android/app/build/outputs/apk/release/app-release.apk \
            "android-release/slippi-android-${{ steps.version.outputs.tag }}.apk"

          build_apk x86_64
          cp Source/Android/app/build/outputs/apk/release/slippi-android-${{ steps.version.outputs.name }}-x86_64-release.apk \
            "android-release/slippi-android-${{ steps.version.outputs.tag }}-x86_64.apk"

          for apk in android-release/*.apk; do
            shasum -a 256 "$apk" > "$apk.sha256"
          done

      - name: Verify packaged APKs
        run: |
          set -euo pipefail

          verify_apk() {
            local apk="$1"
            local abi="$2"
            entries="$(unzip -Z1 "$apk")"
            grep -qx "lib/$abi/libmain.so" <<< "$entries"
            grep -qx "lib/$abi/libmainline_slippi.so" <<< "$entries"
            grep -qx "lib/$abi/libslippi_rust_extensions.so" <<< "$entries"
            grep -qx "assets/MainlineSys/bootloader.gct" <<< "$entries"
            wrong_abis="$(
              awk -F/ '/^lib\// { print $2 }' <<< "$entries" |
                sort -u |
                grep -vx "$abi" || true
            )"
            if [ -n "$wrong_abis" ]; then
              echo "$apk contains unexpected native ABI(s): $wrong_abis" >&2
              exit 1
            fi
          }

          verify_apk "android-release/slippi-android-${{ steps.version.outputs.tag }}.apk" "arm64-v8a"
          verify_apk "android-release/slippi-android-${{ steps.version.outputs.tag }}-x86_64.apk" "x86_64"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: slippi-android-${{ steps.version.outputs.tag }}
          path: android-release/*

      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: android-release/*
